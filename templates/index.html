
<!DOCTYPE html>
<html>
<head>
    <title>Cloud Bus Booking System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            text-align: center;
            padding: 40px;
        }
        .container {
            background: white;
            max-width: 550px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px #0002;
        }
        input, select, button {
            width: 90%;
            padding: 12px;
            margin: 10px;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cloud Bus Booking System</h1>
        <p>Book your bus tickets easily and securely.</p>

        <form action="/search" method="POST">
            <input name="source" placeholder="From" required>
            <input name="destination" placeholder="To (e.g. Bangalore)" required>
            <input type="date" name="journey_date" required>
            <button type="submit">Search Buses</button>
        </form>

        {% if message %}
            <p>{{ message }}</p>
        {% endif %}
    </div>
</body>
</html>
